<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>城市环境监测 · 污染溯源模拟</title>
  <style>
    :root {
      --bg: #0e1420; --panel: #16202f; --panel2: #1d2a3d; --line: #2a3a52;
      --text: #e6edf6; --muted: #8fa3bd; --accent: #4fc3f7; --good: #66bb6a;
      --warn: #ffca28; --bad: #ef5350; --purple: #ab47bc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; font-size: 14px;
    }
    header {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 17px; margin: 0; font-weight: 700; }
    .ctrl { display: flex; align-items: center; gap: 6px; }
    input, select, button {
      background: var(--panel2); color: var(--text); border: 1px solid var(--line);
      border-radius: 7px; padding: 6px 10px; font-size: 13px; outline: none;
    }
    input[type=number] { width: 110px; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { background: #1565c0; border-color: #1e88e5; }
    button.warn { background: #6d4c00; border-color: var(--warn); }
    main { display: grid; grid-template-columns: minmax(640px, 1fr) 360px; gap: 14px; padding: 14px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    .panel h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); letter-spacing: .5px; }
    #stage { position: relative; }
    canvas { background: #0a0f18; border-radius: 8px; display: block; max-width: 100%; }
    #legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .dot { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric { background: var(--panel2); border-radius: 8px; padding: 8px 10px; }
    .metric .k { color: var(--muted); font-size: 12px; }
    .metric .v { font-size: 18px; font-weight: 700; margin-top: 2px; }
    .bar { height: 7px; border-radius: 4px; background: #0a0f18; overflow: hidden; margin-top: 6px; }
    .bar > i { display: block; height: 100%; background: var(--good); transition: width .25s; }
    #lastAction {
      border-left: 4px solid var(--accent); background: var(--panel2);
      border-radius: 6px; padding: 9px 11px; margin: 10px 0; line-height: 1.5;
    }
    #lastAction.bad { border-left-color: var(--bad); }
    #lastAction.good { border-left-color: var(--good); }
    .opgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .opgrid button { padding: 9px 6px; }
    .stations { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    .stations label { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    .tag { padding: 1px 7px; border-radius: 10px; font-size: 11px; }
    .tag.ok { background: #1b5e20; } .tag.no { background: #7f1d1d; }
    .tag.steady { background: #0d47a1; } .tag.critical { background: #b71c1c; } .tag.trace { background: #4a148c; }
    #log { max-height: 210px; overflow-y: auto; font-size: 12px; line-height: 1.6; }
    #log .ev { color: var(--muted); } #log .ev b { color: var(--text); }
    .strategy { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .strategy button { padding: 10px 8px; text-align: left; }
    .compare { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); }
    .right { display: flex; flex-direction: column; gap: 14px; }
    .status-running { color: var(--accent); } .status-success { color: var(--good); } .status-failed { color: var(--bad); }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: var(--panel2); border: 1px solid var(--accent); border-radius: 8px;
      padding: 10px 18px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 9;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>城市环境监测 · 污染溯源</h1>
    <div class="ctrl">
      <span class="hint">Seed</span>
      <input id="seedInput" type="number" value="2026" min="1" />
      <button id="newTaskBtn" class="primary">重开任务</button>
    </div>
    <div class="ctrl">
      <button id="pauseBtn">暂停</button>
      <select id="speedSel">
        <option value="500">慢速 0.5×</option>
        <option value="250" selected>常速 1×</option>
        <option value="120">快速 2×</option>
      </select>
      <button id="stepBtn">单步</button>
    </div>
    <div class="ctrl">
      <button id="autoBtn" class="warn">固定序列复现</button>
      <select id="autoKind">
        <option value="A">复现 + 策略A 源头减排</option>
        <option value="B">复现 + 策略B 应急冲洗</option>
      </select>
      <button id="muteBtn">声音 开</button>
    </div>
    <span class="pill">状态：<b id="statusPill">运行中</b></span>
  </header>

  <main>
    <section class="panel" id="stage">
      <h2>街区 · 风场 · 监测点（点击网格选择采样位置）</h2>
      <canvas id="map" width="728" height="468"></canvas>
      <div id="legend">
        <span><i class="dot" style="background:#4caf50"></i>稳态 ≤18</span>
        <span><i class="dot" style="background:#ffc107"></i>预警 30</span>
        <span><i class="dot" style="background:#f44336"></i>临界 ≥38</span>
        <span><i class="dot" style="background:#fff;border-radius:50%"></i>监测站（红=故障，紫圈=致盲）</span>
        <span><i class="dot" style="background:#4fc3f7"></i>便携采样点</span>
        <span><i class="dot" style="background:#212121"></i>已溯源污染源</span>
        <span><i class="dot" style="background:#aed581;border-radius:50%"></i>指示生物</span>
      </div>
    </section>

    <aside class="right">
      <section class="panel">
        <h2>当前环境指标</h2>
        <div class="metrics">
          <div class="metric"><div class="k">模拟时间</div><div class="v" id="mTime">0s</div></div>
          <div class="metric"><div class="k">预算资源</div><div class="v" id="mBudget">–</div>
            <div class="bar"><i id="bBudget"></i></div></div>
          <div class="metric"><div class="k">生态指数</div><div class="v" id="mEco">–</div>
            <div class="bar"><i id="bEco"></i></div></div>
          <div class="metric"><div class="k">站点峰值浓度</div><div class="v" id="mPeak">–</div></div>
        </div>
        <table style="margin-top:10px">
          <thead><tr><th>站</th><th>读数</th><th>真实</th><th>状态</th></tr></thead>
          <tbody id="stationRows"></tbody>
        </table>
        <div class="hint" id="windHint"></div>
      </section>

      <section class="panel">
        <h2>最近一次操作结果</h2>
        <div id="lastAction">尚未操作</div>
        <div class="stations" id="stationPick"></div>
        <div class="opgrid">
          <button id="samplerBtn">部署采样点(8)</button>
          <button id="calibBtn">校准传感器(12)</button>
          <button id="investBtn">追查污染源(25)</button>
          <button id="steadyBtn">提交稳态记录(4)</button>
          <button id="critBtn">提交临界记录(4)</button>
          <button id="traceBtn">提交溯源记录(4)</button>
        </div>
        <div class="hint" style="margin-top:8px">
          先在网格点击选择坐标，再部署采样点；校准有冷却，污染中校准会致盲并掩盖真实变化。
        </div>
        <div class="strategy">
          <button id="stratABtn">策略A 源头减排<br><small>花费60，排放降至25%</small></button>
          <button id="stratBBtn">策略B 应急冲洗<br><small>花费18，立即稀释但会反弹</small></button>
        </div>
        <div class="compare" id="compareBox"></div>
      </section>

      <section class="panel">
        <h2>可解释记录（需稳态/临界/溯源各一）</h2>
        <table>
          <thead><tr><th>ID</th><th>类型</th><th>站</th><th>浓度</th><th>结果</th></tr></thead>
          <tbody id="recordRows"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>事件日志（含触发阈值与时间）</h2>
        <div id="log"></div>
      </section>
    </aside>
  </main>
  <div class="toast" id="toast"></div>

  <script src="env-engine.js"></script>
  <script src="env-driver.js"></script>
  <script src="env-render.js"></script>
  <script src="env-audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
