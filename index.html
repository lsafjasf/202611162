<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四声道空间音频实验室</title>
<style>
  :root { --bg:#0e1116; --panel:#171c24; --line:#27303c; --fg:#e6edf3; --mut:#8b98a7; --acc:#4aa8ff; --warn:#ffb454; --bad:#ff6b6b; --ok:#57d98c; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; }
  .mode-group button, .btn { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  .mode-group button.active { border-color:var(--acc); color:var(--acc); }
  .btn.primary { background:#15314f; border-color:var(--acc); }
  .layout { display:grid; grid-template-columns:minmax(380px,1.4fr) minmax(320px,1fr); gap:14px; padding:14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  canvas { width:100%; border-radius:8px; background:#0a0d12; display:block; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  label { color:var(--mut); }
  input[type=range] { flex:1; min-width:120px; }
  select,input[type=number] { background:#0d1117; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
  .src-tabs { display:flex; gap:6px; margin-bottom:8px; }
  .src-tabs button { flex:1; }
  .src-tabs button.active { border-color:var(--acc); color:var(--acc); }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { text-align:right; padding:3px 6px; border-bottom:1px solid var(--line); }
  th:first-child,td:first-child { text-align:left; }
  .meter-bar { height:8px; background:#0d1117; border-radius:4px; overflow:hidden; }
  .meter-fill { height:100%; background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad)); width:0%; }
  .spectrum { width:100%; height:120px; background:#0a0d12; border-radius:8px; }
  #test-out { white-space:pre-wrap; font:11px/1.45 ui-monospace,monospace; max-height:260px; overflow:auto; background:#0a0d12; border-radius:8px; padding:8px; }
  .pass { color:var(--ok); } .fail { color:var(--bad); } .info { color:var(--mut); }
  .status { font-size:12px; color:var(--mut); }
  .badge { padding:2px 8px; border-radius:10px; border:1px solid var(--line); }
  .badge.ok { color:var(--ok); border-color:var(--ok); }
  .badge.bad { color:var(--bad); border-color:var(--bad); }
  h2 { font-size:13px; margin:14px 0 6px; color:var(--acc); }
  .hint { color:var(--mut); font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>四声道空间音频实验室</h1>
  <div class="mode-group" id="mode-group">
    <button data-mode="stereo" class="active">普通立体声</button>
    <button data-mode="binaural">双耳 (HRTF)</button>
    <button data-mode="surround">四声道环绕</button>
  </div>
  <span class="badge" id="mode-badge">stereo</span>
  <span class="status" id="status">未启动</span>
  <span style="flex:1"></span>
  <button class="btn" id="btn-play">▶ 启动</button>
  <button class="btn" id="btn-pause">⏸ 暂停</button>
  <button class="btn" id="btn-replay">⟲ 重播</button>
  <button class="btn" id="btn-reset">参数重置</button>
</header>

<div class="layout">
  <div>
    <div class="panel">
      <canvas id="room" width="720" height="432"></canvas>
      <p class="hint">拖动三个声源（A/B/C）或监听点（L）改变位置；距离影响音量与传播延迟，墙面反射影响混响。切换模式不会重置位置。</p>
      <div class="row">
        <label>墙面反射 <span id="refl-val">0.35</span></label>
        <input type="range" id="refl" min="0" max="0.95" step="0.01" value="0.35">
      </div>
    </div>

    <div class="panel">
      <h2>实时仪表（频率 / 声道 / 延迟 / 峰值）</h2>
      <canvas class="spectrum" id="spectrum"></canvas>
      <table>
        <thead><tr><th>声道</th><th>峰值</th><th>RMS</th><th>电平</th></tr></thead>
        <tbody id="meter-body"></tbody>
      </table>
      <table style="margin-top:8px">
        <thead><tr><th>声源</th><th>距离 m</th><th>延迟 ms</th><th>距离增益</th><th>频率 Hz</th><th>节拍 Hz</th></tr></thead>
        <tbody id="param-body"></tbody>
      </table>
    </div>
  </div>

  <div>
    <div class="panel">
      <div class="src-tabs" id="src-tabs"></div>
      <div class="row"><label>频率</label><input type="range" id="p-freq" min="60" max="1200" step="1"><span id="p-freq-v"></span></div>
      <div class="row"><label>波形</label>
        <select id="p-wave"><option>sine</option><option>triangle</option><option>square</option><option>sawtooth</option></select></div>
      <div class="row"><label>音量</label><input type="range" id="p-gain" min="0" max="0.8" step="0.01"><span id="p-gain-v"></span></div>
      <div class="row"><label>节拍频率</label><input type="range" id="p-beat" min="0" max="10" step="0.1"><span id="p-beat-v"></span></div>
      <div class="row"><label>节拍深度</label><input type="range" id="p-depth" min="0" max="1" step="0.01"><span id="p-depth-v"></span></div>
    </div>

    <div class="panel">
      <h2>参数与导出</h2>
      <div class="row">
        <button class="btn primary" id="btn-export-wav">导出 WAV</button>
        <button class="btn" id="btn-save-json">保存参数 JSON</button>
        <label class="btn" for="file-json">载入参数 JSON<input id="file-json" type="file" accept=".json,application/json" hidden></label>
      </div>
      <div class="row">
        <label>导出时长(s)</label><input type="number" id="export-dur" value="3" min="0.5" max="20" step="0.5">
        <button class="btn" id="btn-selftest">运行页内验证</button>
      </div>
      <div id="export-status" class="status"></div>
      <h2>验证结果</h2>
      <div id="test-out" class="info">点击“运行页内验证”，将用 OfflineAudioContext 对三维参数变化、导出检查与保存/重载一致性进行断言。</div>
    </div>
  </div>
</div>

<script src="src/spatial-util.js"></script>
<script src="src/engine.js"></script>
<script src="src/render.js"></script>
<script src="src/browser-test.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
