<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沙暴滑翔机</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a130c; color: #e8d9b8;
    font-family: "PingFang SC", "Microsoft YaHei", monospace; overflow: hidden; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; }
  #bar { position: absolute; top: 8px; right: 10px; display: flex; gap: 8px; z-index: 5; }
  button { background: #3a2c18; color: #e8d9b8; border: 1px solid #8a6d3b;
    padding: 6px 14px; cursor: pointer; font-size: 14px; border-radius: 4px; }
  button:hover { background: #54401f; }
  #summary { position: absolute; inset: 0; display: none; z-index: 10;
    background: rgba(12, 8, 4, 0.88); overflow: auto; padding: 4vh 8vw; box-sizing: border-box; }
  #summary h2 { margin: 0 0 12px; }
  #summary table { border-collapse: collapse; margin: 12px 0; }
  #summary td, #summary th { border: 1px solid #8a6d3b; padding: 6px 16px; text-align: left; }
  #summary .ok { color: #9fd67a; } #summary .bad { color: #e07a5f; }
  #help { position: absolute; left: 10px; bottom: 8px; font-size: 12px; opacity: 0.75; z-index: 5;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="bar">
    <button id="btnPause">暂停 (P)</button>
    <button id="btnRestart">重开 (Enter)</button>
    <button id="btnMute">声音 (M)</button>
  </div>
  <div id="help">↑/↓ 俯仰 · F 翼展 · B 丢压舱 · R 检查点复活 · P 暂停 · Enter 重开</div>
  <div id="summary"></div>
</div>
<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
